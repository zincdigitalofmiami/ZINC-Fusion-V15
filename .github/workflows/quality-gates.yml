name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            config/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Prisma dependencies
        run: npm ci --prefix config

      - name: Ruff (changed Python files)
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags --depth=1 origin "${BASE_SHA}"
            RANGE="${BASE_SHA}...HEAD"
          else
            BEFORE_SHA="${{ github.event.before }}"
            if [[ -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
              RANGE="${BEFORE_SHA}...${{ github.sha }}"
            else
              RANGE="HEAD~1...HEAD"
            fi
          fi

          mapfile -t PY_FILES < <(git diff --name-only --diff-filter=ACMRT "${RANGE}" | grep -E '^(src|scripts|tests)/.*\.pyi?$' | grep -Ev '^scripts/_deprecated/' || true)
          if (( ${#PY_FILES[@]} == 0 )); then
            echo "No Python changes detected; skipping Ruff."
            exit 0
          fi

          printf '%s\n' "${PY_FILES[@]}"
          ruff check --select F401,F403,F405,F821,F841 "${PY_FILES[@]}"

      - name: SQL table contract (changed code files)
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags --depth=1 origin "${BASE_SHA}"
            RANGE="${BASE_SHA}...HEAD"
          else
            BEFORE_SHA="${{ github.event.before }}"
            if [[ -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
              RANGE="${BEFORE_SHA}...${{ github.sha }}"
            else
              RANGE="HEAD~1...HEAD"
            fi
          fi

          mapfile -t CODE_FILES < <(git diff --name-only --diff-filter=ACMRT "${RANGE}" | grep -E '^(src|scripts|frontend/src|tests|sql)/.*\.(py|pyi|ts|tsx|js|jsx|sql)$' || true)
          if (( ${#CODE_FILES[@]} == 0 )); then
            echo "No relevant code changes detected; skipping SQL table contract."
            exit 0
          fi

          printf '%s\n' "${CODE_FILES[@]}"
          python scripts/check_sql_table_references.py "${CODE_FILES[@]}"

      - name: Pytest (unit)
        run: pytest -m "not integration and not training" --cov=src/fusion --cov-report=term-missing --cov-fail-under=12

      - name: Pytest (integration)
        if: env.DATABASE_URL != ''
        run: pytest -m integration -q

      - name: Frontend unit tests
        run: npm --prefix frontend run test:unit

      - name: TypeScript typecheck
        run: npx --prefix frontend tsc --noEmit -p frontend/tsconfig.json

      - name: Prisma validate
        run: npx --prefix config prisma validate --schema prisma/schema.prisma

      - name: Git integrity check
        run: bash scripts/check_git_integrity.sh

      - name: Next.js build (mirrors Vercel)
        run: npm --prefix frontend run build
