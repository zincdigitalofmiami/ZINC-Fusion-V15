# Fly.io configuration for Databento Live Connector
# SINGLE REGION ONLY - Chicago (closest to CME Globex)
app = "zinc-databento-live"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  PYTHONUNBUFFERED = "1"

# Minimal single VM - free tier
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# Disable HA - single instance only
[deploy]
  strategy = "immediate"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1
