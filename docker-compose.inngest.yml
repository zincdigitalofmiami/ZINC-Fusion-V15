version: '3.8'

# Inngest Dev Server — local development & debugging
# Usage: docker compose -f docker-compose.inngest.yml up -d
# UI: http://localhost:8288
# Connects to Next.js dev server at host.docker.internal:3000

services:
  inngest:
    image: inngest/inngest:latest
    container_name: inngest-dev
    ports:
      - "8288:8288"
    command: >
      inngest dev
      -u http://host.docker.internal:3000/api/inngest
    restart: unless-stopped
