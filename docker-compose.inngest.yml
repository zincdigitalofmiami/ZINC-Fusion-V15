# Inngest Dev Server — local development & debugging
# Usage: docker compose -f docker-compose.inngest.yml up -d
# UI: http://localhost:8288
# Target URL is configurable to prevent stale port drift:
#   INNGEST_DEV_URL=http://host.docker.internal:3000/api/inngest
#   docker compose -f docker-compose.inngest.yml up -d

services:
  inngest:
    image: inngest/inngest:latest
    container_name: inngest-dev
    ports:
      - "8288:8288"
    command: >
      inngest dev
      -u ${INNGEST_DEV_URL:-http://host.docker.internal:3000/api/inngest}
    restart: unless-stopped
