# Inngest Dev Server — local development & debugging
# Usage: docker compose -f docker-compose.inngest.yml up -d
# UI: http://localhost:8288
# Serves TWO projects:
#   :3000 → zinc-fusion-v15 (108 functions, "fusion-jobs")
#   :3001 → rabid-raccoon    (25 functions)
# Both Next.js dev servers must be running before starting this container.
# --no-discovery: disables automatic port scanning (explicit URLs only)

services:
  inngest:
    image: inngest/inngest:latest
    container_name: inngest-dev
    ports:
      - "8288:8288"
    command: >
      inngest dev
      --no-discovery
      -u http://host.docker.internal:3000/api/inngest
      -u http://host.docker.internal:3001/api/inngest
    restart: unless-stopped
