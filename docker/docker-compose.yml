services:
  # FastAPI service for ZINC-FUSION
  # MLflow removed 2026-01-18: GrafanaRegistry writes directly to Prisma
  fusion-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      FUSION_API_TOKEN: ${FUSION_API_TOKEN:-}
      FUSION_CORS_ORIGINS: ${FUSION_CORS_ORIGINS:-}
    ports:
      - "8000:8000"
    profiles:
      - api  # Only starts with: docker compose --profile api up
