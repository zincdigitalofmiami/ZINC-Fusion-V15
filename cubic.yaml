# yaml-language-server: $schema=https://cubic.dev/schema/cubic-repository-config.schema.json
# cubic.yaml — ZINC-FUSION-V15 (Soybean oil procurement forecasting)
# Consolidated to 5 mega-rules (open source plan limit) with full context in custom_instructions.
# Original 19 rules compressed — nothing lost, just reorganized for plan compliance.
version: 1
reviews:
  enabled: true
  sensitivity: high
  incremental_commits: true
  check_drafts: true
  architecture_diagrams: false
  show_ai_feedback_buttons: true
  resolve_threads_when_addressed: true
  custom_instructions: |
    SYSTEM CONTEXT: ZINC-FUSION-V15 is a soybean oil (ZL) procurement forecasting system.
    88 Inngest functions, 11 specialist signal generators, AutoGluon ML ensemble, Postgres
    data warehouse (12 schemas), Next.js frontend on Vercel. Client: US Oil Solutions.
    Wrong data = wrong procurement decisions = millions in losses. Review accordingly.

    ARCHITECTURE RULES (violations are P0/P1):
    - Core = price predictor. Single `predicted_price` per horizon. Metric: MAE, NOT WQL.
    - Core does NOT produce quantiles. No p30/p50/p70. No quantile_levels in core config.
    - Target = future ZL futures price via close.shift(-horizon), columns named target_price_{h}d.
    - Probability comes from L2/L3 (Monte Carlo 10k + pinball + MAE%), NOT from core.
    - Exactly 11 specialists (Big-11). trump_effect is the 11th. "10 specialists" = wrong.
    - Visualization = horizontal Target Zones. BANNED: "cones", "bands", "funnels", "cents/lb".
    - No execution/trade logic. Intelligence only.

    INNGEST CRITICAL RULES:
    - Inngest client ID MUST be "fusion-jobs" (Feb 2026 incident: RR contamination)
    - DB_CONCURRENCY = { limit: 5, scope: "env" } — immutable. Every DB function must spread it.
    - ALL side effects (fetch, db, Date.now) MUST be inside step.run() — Inngest replays outside.
    - New functions must be exported from functions.ts AND added to serve() in route.ts.
    - Connection pools go stale across step boundaries — use fresh pool per step.run().

    DATA INTEGRITY (26 of 45 functions have blind spots):
    - New code MUST log to ops.ingest_run (job_name, status, rows_attempted/inserted/skipped/quarantined).
    - Bad data MUST be quarantined to ops.quarantined_record, never silently dropped.
    - Dedup pattern: ON CONFLICT DO UPDATE with row_hash. Flag SELECT+INSERT (TOCTOU race) and DO NOTHING.
    - Landing tables are APPEND-ONLY. No DELETE FROM on mkt/econ/supply/pos/alt schemas.
    - No standalone UPDATE outside ON CONFLICT (except ops.* and documented analytics.* mutables).
    - Point-in-time semantics: never backfill historical rows with values unavailable at that timestamp.

    ML TRAINING:
    - Out-of-fold only. Flag: future data in features, eval on train set, pd.merge without merge_asof.
    - Quantile monotonicity: uncertainty WIDENS with longer horizons. 5d range < 3m range, always.
    - 11 specialists must use real data. Flag hardcoded values or placeholder sentinel values.

    RUNTIME SAFETY:
    - All external API calls need explicit timeouts (AbortSignal.timeout or timeoutMs).
    - API routes must export runtime='nodejs' and maxDuration (Inngest: 300, user-facing: 30-60).
    - Validate numeric inputs: Number.isFinite(), not NaN/null, prices > 0, volumes >= 0.
    - Row hashes: use createHash("sha256").update(`${naturalKey}|${value}`).digest("hex").

    SECURITY:
    - All secrets from process.env. Touches: Databento, FRED, EIA, USDA, NOAA, Scrapecreators,
      Profarmer, Glide, Inngest, OpenAI, Autonoma, 3 database URLs. Flag any hardcoded key/token.
    - No Rabid Raccoon env var references. No cross-project contamination.
    - No .env files committed to git.

    DO NOT WASTE TIME ON: style/formatting, missing docstrings, import ordering, variable naming
    opinions, "consider using X" unless there's a concrete bug. Focus on data corruption, security,
    ML integrity, and runtime failures.

  ignore:
    files:
      - "**/*.md"
      - ".vscode/**"
      - ".claude/**"
      - "frontend/public/**"
      - "frontend/.next/**"
      - "frontend/node_modules/**"
      - "config/node_modules/**"
      - "frontend/prisma/migrations/**"
      - "data/**"
      - "models/**"
      - "logs/**"
      - "reports/**"
      - "AutogluonModels/**"
      - "mlruns/**"
      - ".tmp/**"
      - "*.pkl"
      - "*.parquet"
      - "*.lock"
      - "frontend/test-results/**"

  # 5 mega-rules ordered by blast radius (open source plan may cap at N rules)
  custom_rules:
    - name: "Inngest isolation and concurrency safety"
      description: |
        Flag as CRITICAL: (1) Any change to Inngest client ID away from "fusion-jobs"
        (caused Feb 2026 cross-project contamination incident). (2) Any change to
        DB_CONCURRENCY values (limit:5, scope:"env" are immutable). (3) Side effects
        (fetch, db queries, Date.now) outside step.run() — Inngest replays these causing
        duplicate API calls, phantom DB writes, corrupted logs. (4) New Inngest functions
        not registered in both functions.ts exports AND serve() array in route.ts.
        (5) DB-touching functions missing DB_CONCURRENCY in concurrency array.
      include:
        - "frontend/src/inngest/**/*.ts"
        - "frontend/src/app/api/inngest/route.ts"

    - name: "Data corruption prevention"
      description: |
        Flag as CRITICAL: (1) DELETE FROM on landing tables (mkt/econ/supply/pos/alt schemas)
        — these are append-only. (2) Standalone UPDATE outside ON CONFLICT clauses on data
        tables. (3) Dedup using SELECT+INSERT (TOCTOU race) or ON CONFLICT DO NOTHING (silent
        drops) — must use ON CONFLICT DO UPDATE with row_hash. (4) Missing ops.ingest_run
        logging (26/45 functions are dark). (5) Silently dropped bad data without quarantine
        to ops.quarantined_record. (6) Point-in-time violations: backfilling historical rows
        with values not available at that timestamp.
      include:
        - "frontend/src/inngest/**/*.ts"
        - "frontend/scripts/**/*"
        - "src/**/*.py"

    - name: "ML training integrity and target leakage"
      description: |
        Flag as CRITICAL: (1) Evaluating on training data instead of out-of-fold.
        (2) Future data in feature engineering (temporal leakage). (3) pd.merge() without
        merge_asof() on time-series (lookahead bias). (4) Features computed on full dataset
        then split (information leakage). (5) Core outputting quantiles — core produces only
        predicted_price, metric is MAE not WQL. (6) Target using pct_change() returns instead
        of close.shift(-horizon) price. (7) Specialist signals using hardcoded/placeholder
        values in production. (8) Quantile ranges narrowing with longer horizons (monotonicity
        violation). (9) Any reference to "10 specialists" — there are 11, trump_effect is real.
      include:
        - "src/**/*.py"
        - "frontend/src/inngest/specialist-signals-sync.ts"
        - "frontend/src/lib/specialist-classifier.ts"
        - "frontend/src/lib/ai-intelligence.ts"
        - "frontend/src/app/api/zl/**/*.ts"

    - name: "Security and secrets exposure"
      description: |
        Flag as CRITICAL: (1) Hardcoded API keys, tokens, or connection strings — all must
        come from process.env. Services: Databento, FRED, EIA, USDA, NOAA, Scrapecreators,
        Profarmer, Glide, Inngest, OpenAI, Autonoma, 3 DB URLs. (2) .env files committed to
        git. (3) Rabid Raccoon env var references in V15 code (cross-project contamination).
        (4) SQL injection via string formatting (f-strings, template literals without
        parameterized queries). (5) Missing input validation on API route params — parseInt
        of non-numeric returns NaN, propagates through SQL (e.g. LIMIT NaN).
      include:
        - "frontend/src/**/*.ts"
        - "frontend/src/**/*.tsx"
        - "frontend/scripts/**/*"
        - "src/**/*.py"
        - ".env*"

    - name: "Runtime reliability and resource safety"
      description: |
        Flag as HIGH: (1) External API calls without explicit timeouts (AbortSignal.timeout)
        — hangs block DB_CONCURRENCY slots for entire env. (2) API routes missing runtime
        or maxDuration exports (Inngest: 300, user-facing: 30-60). (3) Missing numeric
        validation (Number.isFinite, NaN, null, negative prices). (4) setInterval with async
        callbacks — causes overlap, use recursive setTimeout. (5) Connection pool reuse across
        Inngest step boundaries (stale after pause). (6) Prisma schema changes without
        accompanying migration. (7) New files outside project directory conventions.
      include:
        - "frontend/src/**/*.ts"
        - "frontend/src/**/*.tsx"
        - "frontend/src/app/api/**/route.ts"
        - "frontend/prisma/schema.prisma"
        - "src/**/*.py"

pr_descriptions:
  generate: true
  cubic_review_link: false
  instructions: |
    Summarize what changed and why. Highlight: Inngest function changes (any of 48 files),
    serve handler, DB_CONCURRENCY, Prisma schema, specialist signal generators, ML training.
    Call out which of the 11 specialists are affected by name. Note if the PR touches any of
    the 26 functions missing ops.ingest_run logging. Flag new data sources and dedup changes.

issues:
  fix_with_cubic_buttons: true
  fix_commits_to_pr: true
