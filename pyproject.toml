[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zinc-fusion"
version = "15.0.0"
description = "Commodity procurement forecasting and decision support (ZL soybean oil)"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "psycopg2-binary",
    "sqlalchemy>=2.0",
    "fastapi>=0.128",
    "uvicorn[standard]>=0.35",
    "pandas>=2.3",
    "numpy>=2.1",
    "scikit-learn>=1.7",
    "scipy>=1.15",
    "statsmodels>=0.14",
    "catboost>=1.2",
    "arch>=7.0",
    "fredapi",
    "python-dotenv",
    "requests",
    "beautifulsoup4",
    "mlflow>=3.9",
    "autogluon-tabular>=1.5",
    "autogluon-timeseries>=1.5",
    "ta-lib>=0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.13",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "black>=24.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# === RUFF (linting + formatting) ===
[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "scripts", "tests"]
exclude = [
    "AutogluonModels",
    "archive",
    "data",
    "models",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "N",   # pep8-naming
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in default arg (FastAPI Depends)
    "N806",  # variable in function should be lowercase (ML convention: X, y)
    "N803",  # argument name should be lowercase (ML convention)
    "UP007", # use X | Y instead of Union (keep for 3.11 compat)
]

[tool.ruff.lint.isort]
known-first-party = ["fusion"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]   # allow assert in tests
"scripts/*" = ["T201"] # allow print in scripts

# === BLACK (formatting) ===
[tool.black]
line-length = 88
target-version = ["py311"]

# === PYTEST ===
[tool.pytest.ini_options]
testpaths = ["tests", "tests/integration"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring database connection",
    "training: marks tests requiring model training",
]

# === COVERAGE ===
[tool.coverage.run]
source = ["src/fusion"]
omit = []

[tool.coverage.report]
fail_under = 15
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

# === MYPY ===
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["AutogluonModels", "archive", "data", "models"]
